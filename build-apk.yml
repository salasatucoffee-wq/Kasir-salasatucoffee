name: Build APK
on:
  push:
    branches: [main, master]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: cp node_modules/jspdf/dist/jspdf.umd.min.js www/ && cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js www/
      - run: npx cap add android
      - run: python3 patch-android.py
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: salasatu-kasir-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
