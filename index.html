<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style><title>Salasatu Kasir</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&display=swap">
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<style>
/* Layout: phone-first POS. Header, content, fixed cart bar + bottom tab bar. Owner area is a PIN-locked tab with sub-tabs. */
:root{
  --bg:#EFE6DC; --surface:#F8F2EA; --ink:#3B2A20; --muted:#7A6556; --line:#DCCDBD;
  --accent:#6F4A32; --accent-ink:#FFFFFF; --accent-soft:#E8D8C6;
  --warn:#8A5A14; --warn-soft:#F3E1BE; --bad:#A8442F; --bad-soft:#F4DAD0; --good:#566F36; --good-soft:#E1E8CC;
  --font-display:'Fraunces',Georgia,'Times New Roman',serif;
  --font-body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'DM Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1E1511; --surface:#2A1D17; --ink:#F1E6DA; --muted:#B39F8E; --line:#43322A;
  --accent:#C99A72; --accent-ink:#1E1511; --accent-soft:#3A2A21;
  --warn:#E2B15C; --warn-soft:#3A2E17; --bad:#E57C70; --bad-soft:#3B1F1B; --good:#A9C77A; --good-soft:#2F3820; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1E1511; --surface:#2A1D17; --ink:#F1E6DA; --muted:#B39F8E; --line:#43322A;
  --accent:#C99A72; --accent-ink:#1E1511; --accent-soft:#3A2A21;
  --warn:#E2B15C; --warn-soft:#3A2E17; --bad:#E57C70; --bad-soft:#3B1F1B; --good:#A9C77A; --good-soft:#2F3820; color-scheme:dark}
*{box-sizing:border-box}
body{background:linear-gradient(180deg,var(--accent-soft) 0,var(--bg) 220px) no-repeat,var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1000px;margin:0 auto;padding-bottom:150px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 0 10px;flex-wrap:wrap}
.brand{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--font-body);font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.who{font-size:13px;color:var(--muted);text-align:right}
h2{font-family:var(--font-display);font-size:19px;margin:18px 0 10px;text-wrap:balance}
h3{font-family:var(--font-display);font-size:16px;margin:0 0 8px}
.muted{color:var(--muted)} .mono{font-family:var(--font-mono);font-variant-numeric:tabular-nums}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 14px;white-space:nowrap;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.card{position:relative;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column;min-width:0}
.card:disabled{opacity:.5;cursor:not-allowed}
.card .pic,.tile{aspect-ratio:1/1;width:100%;max-width:100%;object-fit:cover;display:block}
.tile{display:flex;align-items:center;justify-content:center;font-family:var(--font-display);font-weight:700;font-size:44px;color:#fff}
.card .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.card .nm{font-weight:600;line-height:1.25}
.badge{position:absolute;top:8px;right:8px;background:var(--accent);color:var(--accent-ink);border-radius:999px;min-width:26px;height:26px;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;padding:0 8px}
.tag{display:inline-block;border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
.tag.ok{background:var(--good-soft);color:var(--good)} .tag.bad{background:var(--bad-soft);color:var(--bad)} .tag.warn{background:var(--warn-soft);color:var(--warn)}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;min-width:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.sb{justify-content:space-between}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;min-width:0}
.kpi .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi .v{font-family:var(--font-mono);font-size:20px;font-weight:500;margin-top:2px;overflow-wrap:anywhere}
.bar{height:10px;border-radius:99px;background:var(--accent-soft);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--good)}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn:focus-visible,.chip:focus-visible,.card:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.nav button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
input[type=text],input[type=number],input[type=password],input[type=date],input[type=month],select,textarea{width:100%;max-width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 11px;min-width:0}
textarea{min-height:76px;resize:vertical}
.field{margin-bottom:12px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.list{display:flex;flex-direction:column}
.item{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line);min-width:0}
.item:last-child{border-bottom:0}
.item>div{min-width:0}
.thumb{width:48px;height:48px;border-radius:8px;object-fit:cover;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-family:var(--font-display);font-weight:700}
.tbl{overflow-x:auto}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
td.n,th.n{text-align:right}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  display:flex;justify-content:center;gap:4px;padding:6px max(12px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.nav button{flex:1;max-width:220px;border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:600;color:var(--muted);cursor:pointer}
.nav button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.cartbar{position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:19;max-width:968px;margin:0 auto;
  display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border:0;border-radius:14px;padding:14px 18px;font-weight:600;cursor:pointer;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#modal:empty{display:none}
.back{position:fixed;inset:0;z-index:40;background:rgba(10,16,13,.55);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow-y:auto;border-radius:18px 18px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media(min-width:700px){.back{align-items:center}.sheet{border-radius:18px}}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px;cursor:pointer;font-weight:500}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:var(--bg);cursor:pointer;font-size:16px}
.sub{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:8px;scrollbar-width:none}
.note{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:10px 12px;font-size:13px}
.voidbox{background:var(--bad-soft);color:var(--bad);border-radius:8px;padding:8px 10px;font-size:13px;margin-top:6px}
.chart{overflow-x:auto}
.chart svg{width:100%;min-width:560px;height:auto;display:block}
.chart .b{fill:var(--accent)} .chart .t{stroke:var(--warn);stroke-dasharray:5 4;stroke-width:1.5} .chart .g{stroke:var(--line);stroke-width:1}
.chart text{fill:var(--muted);font-family:var(--font-mono);font-size:11px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(130px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:90%}
#toast:empty{display:none}
@media(prefers-reduced-motion:no-preference){.card{transition:transform .1s}.card:active{transform:scale(.98)}}
</style>

<div class="wrap" id="app"></div>
<div id="modal"></div>
<div id="toast" role="status"></div>

<script>
"use strict";
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const TZ='Asia/Jakarta';
const fKey=new Intl.DateTimeFormat('en-CA',{timeZone:TZ,year:'numeric',month:'2-digit',day:'2-digit'});
const fTime=new Intl.DateTimeFormat('id-ID',{timeZone:TZ,hour:'2-digit',minute:'2-digit',hour12:false});
const fLong=new Intl.DateTimeFormat('id-ID',{timeZone:TZ,weekday:'long',day:'numeric',month:'long',year:'numeric'});
const fMon=new Intl.DateTimeFormat('id-ID',{timeZone:TZ,month:'long',year:'numeric'});
const fShort=new Intl.DateTimeFormat('id-ID',{timeZone:TZ,weekday:'short',day:'numeric',month:'short'});
const dayKey=ts=>fKey.format(ts);
const keyDate=k=>new Date(k+'T12:00:00+07:00');
const todayKey=()=>dayKey(Date.now());
const rp=n=>'Rp'+Math.round(n||0).toLocaleString('id-ID');
const short=n=>n>=1e6?(n/1e6).toFixed(1).replace('.0','')+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(Math.round(n));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const COLS=['menu','pack','orders','stocklog','expenses','settings'];
const CATS=['Kopi','Non-Kopi','Makanan','Lainnya'];
const PAYS=['Tunai','QRIS','Debit'];
const payKeys=o=>[...new Set([...PAYS,...Object.keys(o||{})])];
const REASONS=['Salah input pesanan','Pelanggan membatalkan','Salah menu atau porsi','Pembayaran gagal','Lainnya'];
const LSK='salasatu_v1';

let mem={menu:{},pack:{},orders:{},stocklog:{},expenses:{},settings:{}};
let dbh=null,synced={},uploaded={},pending=false,confirmCb=null,tmpImg=null;
const ls=(k,v)=>{try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){return null}};
const ui={tab:'kasir',cat:'Semua',cart:{},owner:false,sub:'harian',day:todayKey(),month:todayKey().slice(0,7),pay:'Tunai',cash:'',kasir:ls('salasatu_kasir')||'',tries:0};

/* ---------- storage ---------- */
function saveLocal(){ls(LSK,JSON.stringify(mem))}
function loadLocal(){try{const r=ls(LSK);if(r){const o=JSON.parse(r);COLS.forEach(c=>{mem[c]=o[c]||{}});return true}}catch(e){}return false}
function seed(){
  const t=Date.now();
  const P=[['p1','Cup 16oz','pcs',100,20],['p2','Tutup cup','pcs',100,20],['p3','Sedotan','pcs',100,20],['p4','Kotak roti','pcs',30,10],['p5','Kantong kertas','pcs',50,10]];
  P.forEach(([id,name,unit,qty,min])=>{mem.pack[id]={id,name,unit,min};const lid='l'+id;mem.stocklog[lid]={id:lid,pack:id,type:'masuk',qty,note:'Stok awal (contoh)',ts:t,by:'Owner'}});
  const cup=[{id:'p1',qty:1},{id:'p2',qty:1},{id:'p3',qty:1}];
  [['m1','Kopi Susu Salasatu','Kopi',18000,cup],['m2','Americano','Kopi',15000,cup],['m3','Cafe Latte','Kopi',20000,cup],
   ['m4','Matcha Latte','Non-Kopi',22000,cup],['m5','Teh Lemon','Non-Kopi',14000,cup],['m6','Roti Bakar Coklat','Makanan',16000,[{id:'p4',qty:1}]]]
  .forEach(([id,name,cat,price,pack])=>{mem.menu[id]={id,name,cat,price,pack,img:'',active:true,sample:true}});
  mem.settings.main={id:'main',dailyTarget:1500000,monthlyTarget:40000000,pin:''};
}
async function put(col,id,obj){
  obj.id=id;mem[col][id]=obj;saveLocal();render(true);
  if(dbh){try{await dbh.collection(col).doc(id).set(obj)}catch(e){toast('Belum tersinkron: '+(e&&e.code||'error'))}}
}
async function del(col,id){
  delete mem[col][id];saveLocal();render(true);
  if(dbh){try{await dbh.collection(col).doc(id).delete()}catch(e){toast('Belum tersinkron: '+(e&&e.code||'error'))}}
}
function attach(col){
  dbh.collection(col).onSnapshot(snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data()});
    const local=Object.keys(mem[col]);
    if(snap.empty){
      if(!snap.metadata.fromCache&&local.length&&!uploaded[col]){uploaded[col]=true;local.forEach(id=>dbh.collection(col).doc(id).set(mem[col][id]).catch(()=>{}))}
    }else{mem[col]=o;saveLocal()}
    synced[col]=true;render();
  },()=>{});
}
async function initDb(){
  try{const d=await claude.use('db');if(d){dbh=d;COLS.forEach(attach)}}catch(e){}
}

/* ---------- derived data ---------- */
const S=()=>mem.settings.main||{dailyTarget:0,monthlyTarget:0,pin:''};
function packUse(pred){
  const u={};
  Object.values(mem.orders).forEach(o=>{
    if(pred&&!pred(o))return;
    if(o.status==='void'&&o.void&&o.void.returned)return;
    (o.items||[]).forEach(i=>(i.pack||[]).forEach(p=>{u[p.id]=(u[p.id]||0)+p.qty*i.qty}));
  });return u;
}
function stockNow(){
  const inn={};Object.values(mem.stocklog).forEach(l=>{inn[l.pack]=(inn[l.pack]||0)+l.qty});
  const used=packUse();const r={};
  Object.keys(mem.pack).forEach(id=>{r[id]=(inn[id]||0)-(used[id]||0)});return r;
}
function cartLines(){return Object.entries(ui.cart).map(([id,q])=>({m:mem.menu[id],q})).filter(x=>x.m&&x.q>0)}
const cartTotal=()=>cartLines().reduce((a,x)=>a+x.m.price*x.q,0);
const cartCount=()=>cartLines().reduce((a,x)=>a+x.q,0);
function cartNeeds(extraId){
  const n={};const c=Object.assign({},ui.cart);if(extraId)c[extraId]=(c[extraId]||0)+1;
  Object.entries(c).forEach(([id,q])=>{const m=mem.menu[id];if(m)(m.pack||[]).forEach(p=>{n[p.id]=(n[p.id]||0)+p.qty*q})});return n;
}
function stockOk(extraId){const st=stockNow(),n=cartNeeds(extraId);return Object.entries(n).every(([id,q])=>(st[id]||0)>=q)}
function sumOrders(list){
  const ok=list.filter(o=>o.status!=='void'),vd=list.filter(o=>o.status==='void');
  const rev=ok.reduce((a,o)=>a+o.total,0),pay={},items={};
  ok.forEach(o=>{pay[o.pay]=(pay[o.pay]||0)+o.total;o.items.forEach(i=>{const x=items[i.name]||(items[i.name]={qty:0,sum:0});x.qty+=i.qty;x.sum+=i.qty*i.price})});
  return{ok,vd,rev,pay,items,n:ok.length,avg:ok.length?rev/ok.length:0,vdSum:vd.reduce((a,o)=>a+o.total,0)};
}
const ordersWhere=f=>Object.values(mem.orders).filter(f).sort((a,b)=>a.ts-b.ts);
const expWhere=f=>Object.values(mem.expenses).filter(f).sort((a,b)=>a.ts-b.ts);
function hash(s){let h1=0xdeadbeef,h2=0x41c6ce57;for(let i=0;i<s.length;i++){const c=s.charCodeAt(i);h1=Math.imul(h1^c,2654435761);h2=Math.imul(h2^c,1597334677)}
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return (4294967296*(2097151&h2)+(h1>>>0)).toString(36)}
const pinHash=p=>hash('salasatu:'+p);
const hue=s=>{let h=0;for(const c of s)h=(h*31+c.charCodeAt(0))%360;return 16+(h%24)};
const pic=(m,cls)=>m.img?`<img class="${cls||'pic'}" src="${esc(m.img)}" alt="${esc(m.name)}">`:
  `<div class="${cls==='thumb'?'thumb':'tile'}" style="background:hsl(${hue(m.name)} 38% 36%)">${esc(m.name.slice(0,1).toUpperCase())}</div>`;
const thumb=m=>m.img?`<img class="thumb" src="${esc(m.img)}" alt="">`:`<div class="thumb" style="background:hsl(${hue(m.name)} 38% 36%)">${esc(m.name.slice(0,1).toUpperCase())}</div>`;

/* ---------- ui helpers ---------- */
function toast(t){const e=$('#toast');e.textContent=t;clearTimeout(toast.t);toast.t=setTimeout(()=>{e.textContent=''},3200)}
function modal(html){$('#modal').innerHTML=`<div class="back" data-act="backdrop"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`}
function closeModal(){$('#modal').innerHTML='';tmpImg=null}
function ask(msg,cb,label){confirmCb=cb;modal(`<h3>${esc(msg)}</h3><div class="row" style="margin-top:14px"><button class="btn bad" data-act="confirm-yes">${esc(label||'Ya, lanjutkan')}</button><button class="btn" data-act="close">Batal</button></div>`)}
function busy(){const a=document.activeElement;return a&&$('#app').contains(a)&&/^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)}
const prog=(label,val,target)=>{
  const p=target>0?Math.min(100,Math.round(val/target*100)):0,raw=target>0?Math.round(val/target*100):0;
  return `<div class="panel"><div class="row sb"><b>${esc(label)}</b><span class="mono">${raw}%</span></div>
  <div class="bar ${raw>=100?'over':''}" style="margin:8px 0" role="progressbar" aria-valuenow="${raw}" aria-valuemin="0" aria-valuemax="100"><i style="width:${p}%"></i></div>
  <div class="row sb muted"><span class="mono">${rp(val)}</span><span class="mono">Target ${target>0?rp(target):'belum diisi'}</span></div></div>`;
};

/* ---------- views ---------- */
function render(force){
  if(!force&&busy()){pending=true;return}
  pending=false;const y=window.scrollY;
  const t=ui.tab;
  $('#app').innerHTML=`
  <div class="top"><div class="brand">salasatu coffee<small>Kasir</small></div>
  <div class="who">${esc(fLong.format(Date.now()))}${ui.kasir?'<br>Kasir: '+esc(ui.kasir):''}</div></div>
  ${t==='kasir'?vKasir():t==='pesanan'?vOrders():vOwner()}
  ${t==='kasir'&&cartCount()?`<button class="cartbar" data-act="cart"><span>${cartCount()} item</span><span class="mono">${rp(cartTotal())} &rarr; Bayar</span></button>`:''}
  <nav class="nav" aria-label="Menu utama">
    ${[['kasir','Kasir'],['pesanan','Pesanan'],['owner','Owner']].map(([k,l])=>`<button data-act="tab" data-v="${k}" ${t===k?'aria-current="page"':''}>${l}</button>`).join('')}
  </nav>`;
  window.scrollTo(0,y);
}
function vKasir(){
  const items=Object.values(mem.menu).filter(m=>m.active!==false).sort((a,b)=>a.name.localeCompare(b.name));
  const cats=['Semua',...CATS.filter(c=>items.some(m=>m.cat===c))];
  if(!cats.includes(ui.cat))ui.cat='Semua';
  const list=items.filter(m=>ui.cat==='Semua'||m.cat===ui.cat);
  const st=stockNow();
  const sample=Object.values(mem.menu).some(m=>m.sample);
  return `${sample?'<div class="note" style="margin-bottom:10px">Menu dan kemasan di bawah masih contoh. Owner bisa mengganti atau menghapusnya di tab Owner.</div>':''}

/* ---------- printer (ESC/POS lewat Bluetooth, hanya di APK) ---------- */
const PR=Object.assign({width:32,addr:'',name:'',auto:false},(()=>{try{return JSON.parse(ls('salasatu_printer')||'{}')}catch(e){return{}}})());
const savePR=()=>ls('salasatu_printer',JSON.stringify(PR));
const isApk=()=>!!(window.Capacitor&&window.Capacitor.isNativePlatform&&window.Capacitor.isNativePlatform());
const asc=s=>String(s==null?'':s).normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\x20-\x7E]/g,'?');
const num=n=>Math.round(n||0).toLocaleString('id-ID');
function two(l,r,w){l=asc(l);r=asc(r);if(l.length+r.length+1>w)l=l.slice(0,Math.max(1,w-r.length-1));return l+' '.repeat(Math.max(1,w-l.length-r.length))+r}
function escpos(o,w){
  const B=[];const raw=(...b)=>{b.forEach(x=>B.push(x))};const tx=t=>{const z=asc(t)+'\n';for(let i=0;i<z.length;i++)B.push(z.charCodeAt(i))};
  const line='-'.repeat(w);
  raw(0x1B,0x40,0x1B,0x61,1,0x1B,0x45,1,0x1D,0x21,0x11);tx('SALASATU');raw(0x1D,0x21,0x00);tx('COFFEE');raw(0x1B,0x45,0);
  tx(fLong.format(o.ts));tx(fTime.format(o.ts)+'  '+o.no);tx('Kasir: '+o.kasir);raw(0x1B,0x61,0);tx(line);
  o.items.forEach(i=>{tx(two(i.qty+'x '+i.name,num(i.qty*i.price),w))});
  tx(line);raw(0x1B,0x45,1);tx(two('TOTAL','Rp'+num(o.total),w));raw(0x1B,0x45,0);
  if(o.pay==='Tunai'){tx(two('Tunai','Rp'+num(o.paid),w));tx(two('Kembali','Rp'+num(o.change),w))}else tx(two('Bayar',o.pay,w));
  raw(0x1B,0x61,1);tx(line);tx('Terima kasih');tx('@salasatucoffee');raw(0x1B,0x64,4,0x1D,0x56,0x42,0x00);
  return new Uint8Array(B);
}
async function btSend(bytes){
  const b=window.bluetoothSerial;
  const on=await new Promise(r=>b.isConnected(()=>r(true),()=>r(false)));
  if(!on)await new Promise((res,rej)=>{let d=false;b.connect(PR.addr,()=>{if(!d){d=true;res()}},e=>{if(!d){d=true;rej(e)}})});
  for(let i=0;i<bytes.length;i+=480){await new Promise((res,rej)=>b.write(bytes.slice(i,i+480).buffer,res,rej))}
}

const pdfOk=()=>!!(window.jspdf&&window.jspdf.jsPDF);

function sect(doc,t){if(doc.y>740){doc.addPage();doc.y=48}doc.setFont('helvetica','bold');doc.setFontSize(11);doc.text(asc(t),40,doc.y+10);doc.y+=16}
function tbl(doc,head,body,opts){
  if(!body.length){doc.setFont('helvetica','normal');doc.setFontSize(9);doc.text('Tidak ada data.',40,doc.y+10);doc.y+=26;return}
  doc.autoTable(Object.assign({startY:doc.y,head:[head],body:body.map(r=>r.map(asc)),styles:{fontSize:9,cellPadding:4},headStyles:{fillColor:[111,74,50]},margin:{left:40,right:40}},opts||{}));
  doc.y=doc.lastAutoTable.finalY+18;
}
const R1={columnStyles:{1:{halign:'right'}}};
function voidRows(list,withDate){return list.map(o=>[(withDate?fShort.format(o.ts)+' ':'')+fTime.format(o.ts)+' '+o.no,o.kasir,rp(o.total),(o.void?o.void.reason+(o.void.note?': '+o.void.note:''):''),(o.void?o.void.by+(o.void.returned?' (kemasan kembali)':''):'')])}
async function savePdf(doc,name){
  try{
    if(isApk()){
      const P=(window.Capacitor&&window.Capacitor.Plugins)||{};
      const b64=doc.output('datauristring').split(',')[1];
      const r=await P.Filesystem.writeFile({path:name,data:b64,directory:'CACHE'});
      await P.Share.share({title:name,text:'Laporan Salasatu Coffee',url:r.uri,dialogTitle:'Simpan atau kirim laporan'});
      return;
    }
    const dl=window.claude&&window.claude.use?await window.claude.use('downloads'):null;
    if(dl){await dl.save({filename:name,data:doc.output('blob')});toast('PDF disimpan');return}
    doc.save(name);
  }catch(e){if(e&&e.code==='declined')return;toast('PDF gagal disimpan')}
}
async function pdfDaily(d){
  if(!pdfOk()){toast('Pembuat PDF belum termuat. Cek koneksi internet.');return}
  const list=ordersWhere(o=>o.day===d),s=sumOrders(list),ex=expWhere(e=>e.day===d),exSum=ex.reduce((a,e)=>a+e.amount,0),use=packUse(o=>o.day===d),dt=S().dailyTarget;
  const doc=newDoc('Laporan Harian',fLong.format(keyDate(d)));
  sect(doc,'Ringkasan');tbl(doc,['Keterangan','Nilai'],[['Pendapatan',rp(s.rev)],['Pesanan selesai',String(s.n)],['Rata-rata per pesanan',rp(s.avg)],['Pengeluaran',rp(exSum)],['Sisa setelah pengeluaran',rp(s.rev-exSum)],['Pesanan dibatalkan',s.vd.length+' ('+rp(s.vdSum)+')'],['Target harian',dt?rp(dt)+' ('+Math.round(s.rev/dt*100)+'%)':'Belum diisi']],R1);
  sect(doc,'Per metode bayar');tbl(doc,['Metode','Nilai'],payKeys(s.pay).map(k=>[k,rp(s.pay[k]||0)]),R1);
  sect(doc,'Menu terjual');tbl(doc,['Menu','Jumlah','Nilai'],Object.entries(s.items).sort((a,b)=>b[1].qty-a[1].qty).map(([n,x])=>[n,String(x.qty),rp(x.sum)]),{columnStyles:{1:{halign:'right'},2:{halign:'right'}}});
  sect(doc,'Kemasan terpakai');tbl(doc,['Kemasan','Terpakai'],Object.entries(use).map(([id,q])=>[(mem.pack[id]||{name:id}).name,String(q)]),R1);
  sect(doc,'Pengeluaran');tbl(doc,['Keperluan','Jumlah'],ex.map(e=>[e.name,rp(e.amount)]),R1);
  sect(doc,'Pesanan dibatalkan');tbl(doc,['Pesanan','Kasir','Nilai','Alasan','Dibatalkan oleh'],voidRows(s.vd,false));
  await savePdf(doc,'laporan-harian-'+d+'.pdf');

async function pdfMonthly(m){
  if(!pdfOk()){toast('Pembuat PDF belum termuat. Cek koneksi internet.');return}
  const[y,mo]=m.split('-').map(Number),days=new Date(y,mo,0).getDate();
  const list=ordersWhere(o=>o.month===m),s=sumOrders(list),ex=expWhere(e=>e.month===m),exSum=ex.reduce((a,e)=>a+e.amount,0),use=packUse(o=>o.month===m),mt=S().monthlyTarget;
  const rows=[];for(let i=1;i<=days;i++){const k=m+'-'+String(i).padStart(2,'0'),ds=sumOrders(list.filter(o=>o.day===k)),de=ex.filter(e=>e.day===k).reduce((a,e)=>a+e.amount,0);if(ds.n||ds.vd.length||de)rows.push([fShort.format(keyDate(k)),String(ds.n),rp(ds.rev),String(ds.vd.length),rp(de),rp(ds.rev-de)])}

  sect(doc,'Rekap per tanggal');tbl(doc,['Tanggal','Pesanan','Pendapatan','Batal','Pengeluaran','Sisa'],rows,{columnStyles:{1:ra,2:ra,3:ra,4:ra,5:ra}});
  sect(doc,'Menu terlaris');tbl(doc,['Menu','Jumlah','Nilai'],Object.entries(s.items).sort((a,b)=>b[1].qty-a[1].qty).map(([n,x])=>[n,String(x.qty),rp(x.sum)]),{columnStyles:{1:ra,2:ra}});

const sync=()=>{closeModal();render(true)};
document.addEventListener('click',async e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id,v=el.dataset.v;
  if(a==='backdrop'){if(e.target===el)closeModal();return}
  switch(a){
    case 'tab':ui.tab=v;render(true);window.scrollTo(0,0);break;
    case 'cat':ui.cat=v;render(true);break;
    case 'add':if(!stockOk(id)){toast('Kemasan tidak cukup');break}ui.cart[id]=(ui.cart[id]||0)+1;render(true);break;
    case 'cart':openCart();break;
    case 'inc':if(!stockOk(id)){toast('Kemasan tidak cukup');break}ui.cart[id]=(ui.cart[id]||0)+1;render(true);openCart();break;
    case 'dec':ui.cart[id]=(ui.cart[id]||0)-1;if(ui.cart[id]<=0)delete ui.cart[id];render(true);openCart();break;
    case 'pay':ui.pay=v;openCart();break;
    case 'cashq':ui.cash=v;openCart();break;
    case 'checkout':checkout();break;
    case 'close':closeModal();break;
    case 'void':voidModal(id);break;
    case 'sub':ui.sub=v;render(true);break;
    case 'lock':ui.owner=false;render(true);break;
    case 'editmenu':menuModal(id);break;
    case 'rmimg':tmpImg='';{const p=$('#imgprev');if(p)p.innerHTML=''}break;
    case 'delmenu':ask('Hapus menu ini? Riwayat penjualan lama tetap tersimpan.',async()=>{await del('menu',id);sync()});break;
    case 'editpack':packModal(id);break;
    case 'delpack':{const used=Object.values(mem.menu).some(m=>(m.pack||[]).some(p=>p.id===id));
      if(used){toast('Masih dipakai oleh menu. Lepas dulu dari menu.');break}
      ask('Hapus jenis kemasan ini?',async()=>{await del('pack',id);sync()});break}
    case 'addstock':stockModal(id,'masuk');break;
    case 'opname':stockModal(id,'opname');break;
    case 'delexp':ask('Hapus catatan pengeluaran ini?',async()=>{await del('expenses',id);sync()});break;
    case 'pdfd':pdfDaily(ui.day);break;
    case 'pdfm':pdfMonthly(ui.month);break;
    case 'addmenu':ui.tab='owner';ui.sub='menu';render(true);window.scrollTo(0,0);if(ui.owner)menuModal('');else toast('Masukkan kode owner dulu');break;
    case 'showo':{const o=mem.orders[id];if(o)modal(`<h3>Struk ${esc(o.no)}</h3>${receipt(o)}<div class="row" style="margin-top:12px"><button class="btn pri" data-act="printo" data-id="${id}">Cetak struk</button><button class="btn" data-act="close">Tutup</button></div>`)}break;
    case 'printo':printOrder(id);break;
    case 'pickprinter':pickPrinter();break;
    case 'setprinter':PR.addr=id;PR.name=v;savePR();closeModal();render(true);toast('Printer dipilih');break;
    case 'testprint':testPrint();break;
    case 'confirm-yes':{const cb=confirmCb;confirmCb=null;if(cb)await cb()}break;
  }
});
document.addEventListener('submit',async e=>{
  const f=e.target.closest('[data-form]');if(!f)return;e.preventDefault();
  const k=f.dataset.form,id=f.dataset.id,fd=new FormData(f);
  const s=Object.assign({id:'main',dailyTarget:0,monthlyTarget:0,pin:''},mem.settings.main||{});
  if(k==='setpin'){
    const p1=fd.get('p1'),p2=fd.get('p2');
    if(!/^\d{4,8}$/.test(p1)){toast('Kode harus 4 sampai 8 angka');return}
    if(p1!==p2){toast('Kedua kode tidak sama');return}
    s.pin=pinHash(p1);ui.owner=true;await put('settings','main',s);toast('Kode owner tersimpan');
  }else if(k==='unlock'){
    if(pinHash(fd.get('pin'))===s.pin){ui.owner=true;ui.tries=0;render(true)}
    else{ui.tries++;toast(ui.tries>=3?'Kode salah. Hanya owner yang boleh membuka area ini.':'Kode salah');f.reset()}
  }else if(k==='changepin'){
    if(pinHash(fd.get('old'))!==s.pin){toast('Kode lama salah');return}
    const p1=fd.get('p1');if(!/^\d{4,8}$/.test(p1)||p1!==fd.get('p2')){toast('Kode baru tidak valid atau tidak sama');return}
    s.pin=pinHash(p1);await put('settings','main',s);toast('Kode diganti');
  }else if(k==='target'){
    s.dailyTarget=Math.max(0,+fd.get('d')||0);s.monthlyTarget=Math.max(0,+fd.get('m')||0);await put('settings','main',s);toast('Target tersimpan');
  }else if(k==='void'){
    const o=mem.orders[id];if(!o||o.status==='void')return;
    const note=String(fd.get('note')||'').trim(),by=String(fd.get('by')||'').trim();
    if(note.length<5){toast('Penjelasan minimal 5 huruf');return}
    if(!by){toast('Isi nama kasir');return}
    ui.kasir=by;ls('salasatu_kasir',by);
    const n=Object.assign({},o,{status:'void',void:{ts:Date.now(),by,reason:fd.get('reason'),note,returned:fd.get('returned')==='on'}});
    await put('orders',id,n);sync();toast('Pembatalan tercatat');
  }else if(k==='expense'){
    const ts=Date.now(),dk=ui.day;
    await put('expenses',uid(),{name:String(fd.get('name')).trim(),amount:Math.round(+fd.get('amount')||0),ts,day:dk,month:dk.slice(0,7)});toast('Pengeluaran dicatat');
  }else if(k==='menu'){
    const pack=[];Object.keys(mem.pack).forEach(pid=>{if(fd.get('pk_'+pid)==='on')pack.push({id:pid,qty:Math.max(1,Math.round(+fd.get('pq_'+pid)||1))})});
    const old=id?mem.menu[id]:null;
    const m={name:String(fd.get('name')).trim(),price:Math.round(+fd.get('price')||0),cat:fd.get('cat'),pack,img:tmpImg||'',active:fd.get('active')==='on'};
    if(old&&old.sample)m.sample=false;
    await put('menu',id||uid(),m);sync();toast('Menu tersimpan');
  }else if(k==='pack'){
    const old=id?mem.pack[id]:null;const pid=id||uid();
    await put('pack',pid,{name:String(fd.get('name')).trim(),unit:String(fd.get('unit')||'pcs').trim()||'pcs',min:Math.max(0,Math.round(+fd.get('min')||0))});
    if(!old){const q=Math.round(+fd.get('stock')||0);if(q>0)await put('stocklog',uid(),{pack:pid,type:'masuk',qty:q,note:'Stok awal',ts:Date.now(),by:'Owner'})}
    sync();toast('Kemasan tersimpan');
  }else if(k==='addstock'){
    const q=Math.round(+fd.get('qty')||0);if(q<1)return;
    await put('stocklog',uid(),{pack:id,type:'masuk',qty:q,note:String(fd.get('note')||'').trim(),ts:Date.now(),by:'Owner'});sync();toast('Stok ditambahkan');
  }else if(k==='opname'){
    const phys=Math.round(+fd.get('qty')),exp=stockNow()[id]||0;if(isNaN(phys)||phys<0)return;
    await put('stocklog',uid(),{pack:id,type:'opname',qty:phys-exp,physical:phys,expected:exp,note:String(fd.get('note')||'').trim(),ts:Date.now(),by:'Owner'});
    sync();toast(phys===exp?'Stok cocok':'Selisih '+(phys-exp)+' tercatat');
  }
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.id==='pw'){PR.width=+t.value===48?48:32;savePR()}
  else if(t.id==='pauto'){PR.auto=t.checked;savePR()}
  else if(t.id==='dayp'&&t.value){ui.day=t.value;render(true)}
  else if(t.id==='monp'&&t.value){ui.month=t.value;render(true)}
  else if(t.id==='imgfile'&&t.files&&t.files[0]){
    try{tmpImg=await fileToImg(t.files[0]);const p=$('#imgprev');if(p)p.innerHTML=`<img src="${tmpImg}" alt="" style="width:100%;height:100%;object-fit:cover">`}
    catch(err){toast('Gambar tidak bisa dibaca')}
  }
});
document.addEventListener('input',e=>{
  if(e.target.id==='cash'){ui.cash=e.target.value;const c=$('#change');if(c)c.textContent=rp(Math.max(0,(+ui.cash||0)-cartTotal()))}
  else if(e.target.id==='kasir'){ui.kasir=e.target.value}
});
document.addEventListener('focusout',()=>{setTimeout(()=>{if(pending&&!busy())render()},120)});
function fileToImg(file,max){
  max=max||420;
  return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{
    const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');
    c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    res(c.toDataURL('image/jpeg',.72))};im.onerror=rej;im.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
}

/* ---------- boot ---------- */
if(!loadLocal()){seed();saveLocal()}
render(true);
initDb();
